<html>
<head>
  <link href="login.css" rel="stylesheet" /> 
  
  <title>Jajanskuy</title>

  
</head>

<body>
  <main class="login-layout">
    
    <section class="brand-panel" aria-label="JajanKuy branding">
      <div> 
        <img src="../asset/JajanKuy_Snack_Emblem.png" alt="corner image" 
        style="width: 50;
        position: absolute;
        top: 10px;
        left: 10px;"  > 
      </div>
       
      <img src="../asset/JajanKuy_Snack_Duo_Illustration.png" alt="JajanKuy Snack emblem">
      
    </section>
    <section class="form-panel">
    <div class="login-card">
      <script> src="login.js" </script>
    <h1>Welcome Back</h1>
    <p class="subtitle">Log in to your account</p>

    <form action="#" method="post">
      <div class="form-group" >
        
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required 
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>


      <!-- <button type="submit" href="../HomePage/jajankuy.html">Log In</button> -->
       <div><a href="../HomePage/jajankuy.html">Login</a></div>
    </form>
    </div>
    </section>
  </main>
  <script src="../script.js"></script>
</body>
</html>
