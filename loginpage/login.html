<html>
<head>
  <link href="login.css" rel="stylesheet" /> 
  
  <title>Jajanskuy</title>

  
</head>

<body>
  <main class="login-layout">
    
    <section class="brand-panel" aria-label="JajanKuy branding">
      <div> 
        <img src="https://cdn.discordapp.com/attachments/1558016416387694615/1558019881012564088/JajanKuy_Snack_Emblem.png?ex=6acd3656&is=6acbe4d6&hm=a7ce2bb411756539b70f4a6d9a0d59adf7251038022f79743a6413ed5562b67c&" alt="corner image" 
        style="width: 50;
        position: absolute;
        top: 10px;
        left: 10px;"  > 
      </div>
       
      <img src="https://cdn.discordapp.com/attachments/1558016416387694615/1559024714830061719/JajanKuy_Snack_Duo_Illustration.png?ex=6acd9269&is=6acc40e9&hm=b2b450662c30a8fe17fa9386c1a8de1ba08e1201db9448f50c4ca2d0b6939a87&" alt="JajanKuy Snack emblem">
      
    </section>
    <section class="form-panel">
    <div class="login-card">
      <script> src="login.js" </script>
    <h1>Welcome Back</h1>
    <p class="subtitle">Log in to your account</p>

    <form action="#" method="post">
      <div class="form-group" >
        
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="you@example.com"
          autocomplete="email"
          required 
        >
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>


      <button type="submit" id="mainbtn">Log In</button>
    </form>

    <p >
      <h1 id="demo"> 1</h1>
    </p>
    <!-- <p class="number" id="expensiveCount">1</p> -->

    </div>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
