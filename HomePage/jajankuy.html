<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#96080D">
  <title>JajanKuy — Teman Ngemil Kamu</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="#beranda" aria-label="JajanKuy, beranda">
      <img src="asset/JajanKuy_Snack_Emblem.png" alt="Logo JajanKuy">
      <span>Jajan<span class="brand-highlight">Kuy</span></span>
    </a>
    <nav class="header-actions" aria-label="Navigasi akun">
      <a class="login-link" href="#login">Login</a>
      <a class="cart-link" href="#keranjang"><span aria-hidden="true">🛒</span> Keranjang <span
          class="cart-count">0</span></a>
    </nav>
  </header>

  <main id="beranda">
    <section class="products-section" id="produk">
      <div class="section-heading">
        <div><span class="eyebrow">PILIHAN BUAT KAMU</span>
          <h2>Camilan <span>Favorit</span></h2>
        </div>
        <a class="see-all" href="#produk">Lihat semua <span aria-hidden="true">→</span></a>
      </div>
      <div class="product-grid" id="produk-gueh">
      </div>
    </section>
  </main>
  <footer><a class="footer-brand" href="#beranda">Jajan<span>Kuy</span></a>
    <p>Jajan enak, hati senang. ✨</p><small>© 2026 JajanKuy.</small>
  </footer>
  <script src="script.js"></script>
</body>

</html>
