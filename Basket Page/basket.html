<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keranjang Kamu — JajanKuy</title>
    <link rel="stylesheet" href="basket.css">
    <script src="basket.js" defer></script>
</head>
<body >
    <!-- logo dan navigasi -->
    <header class="site-header">
        <div class="container header-inner">
            <a href="basket.html">
                <img class="brand-logo" src="JajanKuy Snack Emblem.png" alt="Keranjang JajanKuy">
            </a>
            <nav>
                <a class="nav-item" href="menu.html">Menu</a>
                <a id="cart-link" class="nav-item active" href="basket.html">Keranjang</a>
                <a class="nav-item" href="#akun" data-account>Masuk</a>
            </nav>
        </div>
    </header>

  
    <!-- Isi keranjang yang bisa gerak oleh basket.js -->
    <main class="container">
        <section id="keranjang">
            <div class="section-heading">
                <div>
                    <h1 id="cart-title">Keranjang kamu.</h1>
                    <p>Ada kami, kamu pasti kenyang.</p>
                </div>
                <p class="heading-badge">Dibuat dan diantar dengan baik untuk kamu ✨</p>
            </div>
            <div id="basket-content" tabindex="-1" aria-live="polite">
                <div class="empty-cart" tabindex="-1">
                    <div class="empty-art" aria-hidden="true">🛍️</div>
                    <h2>Keranjang kamu masih kosong</h2>
                    <p>Yuk, temukan jajanan kamu hari ini.</p>
                    <a href="menu.html">Pilih jajanan →</a>
                </div>
            </div>
            <noscript><p>Aktifkan JavaScript untuk mengelola keranjang.</p></noscript>
        </section>
    </main>

    <!-- Footer dan pesan status -->
    <footer class="site-footer">
        <div class="container">
            <a class="footer-brand" href="basket.html">JajanKuy.</a>
            <p>Jajanan kecil, bahagia besar.</p>
            <small>© 2026 JajanKuy</small>
        </div>
    </footer>
    <p id="notice" class="notice" role="status" hidden></p>
</body>
</html>
